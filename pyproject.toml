[project]
name = "llm-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Retinpkumar", email = "retinpkumar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.122.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.scripts]
llm-service = "llm_service:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
